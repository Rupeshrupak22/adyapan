name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true
